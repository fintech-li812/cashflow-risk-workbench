# jdjrkj.online -> cashflow risk workbench
#
# Replaces the previous static site at /var/www/html. The old site and the old
# nginx file are preserved in /root/backup-网站-20261027/.
#
# The application only ever listens on 127.0.0.1:8000; TLS is terminated here.
# The frontend calls relative /api/* paths, so it must stay on the site root.

server {
    listen 80;
    listen [::]:80;
    server_name jdjrkj.online;
    return 301 https://$host$request_uri;
}

server {
    # nginx 1.24 (Ubuntu 24.04) has no standalone `http2 on;` directive, so the
    # parameter form is required here even though upstream deprecates it.
    listen 443 ssl http2;
    listen [::]:443 ssl http2 ipv6only=on;
    server_name jdjrkj.online;

    ssl_certificate /etc/letsencrypt/live/jdjrkj.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jdjrkj.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    # The API rejects bodies over 512 KB; this is the outer guard.
    client_max_body_size 2m;

    # Never log request bodies or headers that could carry a token.
    access_log /var/log/nginx/cashflow.access.log;
    error_log /var/log/nginx/cashflow.error.log warn;

    location /mcp {
        proxy_pass http://127.0.0.1:8123;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
